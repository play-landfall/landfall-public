<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Landfall — dark mode mock-up</title>
<style>
  html, body { margin:0; height:100%; background:#000; }
  body { display:flex; flex-direction:column; font:600 12px/1.2 system-ui,sans-serif; }
  #bar { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:6px 8px; background:#000; flex:none; }
  #bar label { display:flex; flex-direction:column; gap:2px; color:#888; font-size:10px; letter-spacing:.1em; text-transform:uppercase; min-width:0; }
  #bar select { min-height:36px; min-width:0; padding:0 6px; border:1.5px solid #555; border-radius:6px; background:#111; color:#fff; font:600 14px system-ui,sans-serif; }
  iframe { flex:1; width:100%; border:0; min-height:0; }
</style>
</head>
<body>
<div id="bar"></div>
<iframe id="game" src="../index.html" title="Landfall"></iframe>
<script src="themes.js"></script>
<script>
const M = LFMOCK, frame = document.getElementById('game'), bar = document.getElementById('bar');
const AX = [['theme', 'Colour', Object.assign({}, M.THEMES, { light: { name: 'Light (now)' } }), 'watch'], ['shape', 'Shape', M.SHAPES, 'block'], ['font', 'Type', M.FONTS, 'journal']];
const v = {};
// ?theme=dusk&shape=soft&font=round links straight to a combination
const q = new URLSearchParams(location.search);
for (const [k, , set, def] of AX) { const got = q.get(k) || localStorage.getItem('landfall.mock.' + k); v[k] = set[got] ? got : def; }
bar.innerHTML = AX.map(([k, label, set]) => `<label>${label}<select data-k="${k}">${Object.entries(set).map(([id, o]) => `<option value="${id}"${id === v[k] ? ' selected' : ''}>${o.name}</option>`).join('')}</select></label>`).join('');
function paint() { try { M.apply(frame.contentDocument, v.theme, v.shape, v.font); } catch (e) {} }
bar.addEventListener('change', e => { const k = e.target.dataset.k; v[k] = e.target.value; localStorage.setItem('landfall.mock.' + k, v[k]); paint(); });
frame.addEventListener('load', paint); paint();
</script>
</body>
</html>
